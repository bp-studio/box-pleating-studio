minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@mutsuntsai/*"
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  ttf2woff2: true
  unrs-resolver: false
overrides:
  js-yaml: ^4.1.1
  magic-string: ^0.30.0
peerDependencyRules:
  allowAny:
    - eslint
publicHoistPattern:
  - "@rspack/core"
  - "@popperjs/core"
  - "@pixi/*"
  - "@vue/*"
